<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Libraries are served from vendor/, not a CDN: this page is embedded in an
      EU-hosted site and the CDN copies disclosed every visitor's IP to four US
      origins before any consent prompt. scripts/vendor-dashboard-libs.mjs copies
      them out of node_modules at build time, so versions are pinned in
      package.json rather than floating on `latest`.
    -->
    <link href="vendor/inter.css" rel="stylesheet" />

    <!--
      No preload for the data: script.js requests the nightly copy from GitHub
      Pages and only falls back to the committed captures.csv, so preloading the
      local file would download ~2 MB that is usually discarded. Warming the
      connection is the part that helps — it takes the DNS and TLS handshake off
      the critical path before the deferred script runs.
    -->
    <link rel="preconnect" href="https://eurosense.github.io" crossorigin />

    <!-- Highcharts for the map -->
    <script src="vendor/highmaps.js"></script>
    <script src="vendor/highmaps-exporting.js"></script>
    <script src="vendor/highmaps-accessibility.js"></script>
    <!-- ECharts for bar/pie charts -->
    <script src="vendor/echarts.min.js"></script>
    <!-- Papa Parse for CSV -->
    <script src="vendor/papaparse.min.js"></script>
    <!-- Plotly for the ternary charts (cartesian bundle: it holds scatterternary) -->
    <script src="vendor/plotly-cartesian.min.js"></script>

    <script src="script.js" defer></script>

    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
      }
      .dashboard-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 20px;
      }
      /*
       * min-width: 0 is load-bearing. A grid item's automatic minimum size is
       * its min-content width, and a rendered Highcharts/Plotly SVG reports a
       * large one — so the column grew to fit the chart, the chart redrew to
       * fill the wider column, and the dashboard settled about twice as wide as
       * the viewport with the map cut off. Same reason for minmax(0, 1fr) below.
       */
      .chart-box {
        background: #fff;
        border-radius: 8px;
        border: 1px solid #ddd;
        padding: 20px;
        min-width: 0;
      }
      .chart {
        width: 100%;
        height: 400px;
      }
      .bar-chart {
        width: 100%;
        height: 300px;
      }
      .map-box {
        grid-column: 1 / -1;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #ddd;
        padding: 20px;
        min-width: 0;
      }
      .sentiment-map-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .origin-map-box {
        display: flex;
      }
      .origin-map-chart {
        width: 50%;
      }
      .sentiment-map-chart {
        min-width: 0;
      }
      .sentiment-controls {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
      }
      .filter-groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .filter-group {
        min-width: 0;
      }
      .filter-group h3 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      .sentiment-options {
        display: grid;
        gap: 8px;
      }
      .sentiment-option {
        width: 100%;
        border: 1px solid #c9c9d0;
        border-radius: 6px;
        background: #fff;
        color: #302d3b;
        padding: 8px 9px;
        text-align: left;
        font: inherit;
        font-size: 0.88rem;
        cursor: pointer;
      }
      .sentiment-option:hover,
      .sentiment-option[aria-pressed="true"] {
        border-color: #133bc7;
        background: #eef1ff;
      }
      .map-chart {
        width: 100%;
        height: 600px;
      }
      @media (min-width: 800px) {
        .dashboard-container {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .map-box {
          grid-column: 1 / 3;
        }
        .sentiment-map-layout {
          grid-template-columns: minmax(0, 1fr) minmax(400px, 1fr);
        }
        .origin-map-chart {
          width: 50%;
        }
      }
      @media (max-width: 799px) {
        .sentiment-map-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .sentiment-controls {
          grid-row: 1;
        }
        .origin-map-chart {
          width: 100%;
        }
      }
      @media (max-width: 560px) {
        .filter-groups {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @media (max-width: 600px) {
        .echarts-title {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Map -->
      <div class="map-box origin-map-box">
        <div id="europeMap" class="map-chart origin-map-chart"></div>
      </div>
      <!-- Additional country map for narrator-rated sentiment; keeps europeMap unchanged. -->
      <div class="map-box">
        <div class="sentiment-map-layout">
          <div class="sentiment-map-chart">
            <div id="sentimentMap" class="map-chart"></div>
          </div>
          <aside class="sentiment-controls" aria-label="Map filters">
            <div class="filter-groups">
              <section class="filter-group" aria-labelledby="sentimentTitle">
                <h3 id="sentimentTitle">Narrator-rated sentiment</h3>
                <div id="sentimentOptions" class="sentiment-options" role="group" aria-label="Choose sentiment to show on the map"></div>
              </section>
              <section class="filter-group" aria-labelledby="topicTitle">
                <h3 id="topicTitle">Topic classification</h3>
                <div id="topicOptions" class="sentiment-options" role="group" aria-label="Choose topic classification to show on the map"></div>
              </section>
            </div>
          </aside>
        </div>
      </div>
      <!-- Bar charts -->
      <div class="chart-box">
        <div id="barChart1" class="bar-chart"></div>
      </div>
      <div class="chart-box">
        <div id="barChart2" class="bar-chart"></div>
      </div>
      <div class="chart-box">
        <div id="barChart3" class="bar-chart"></div>
      </div>
      <div class="chart-box">
        <div id="barChart4" class="bar-chart"></div>
      </div>
      <!-- Pie charts -->
      <div class="chart-box">
        <div id="chart1" class="chart"></div>
      </div>
      <div class="chart-box">
        <div id="chart2" class="chart"></div>
      </div>
      <div class="chart-box">
        <div id="chart3" class="chart"></div>
      </div>
      <div class="chart-box">
        <div id="chart4" class="chart"></div>
      </div>
      <div class="chart-box">
        <div id="ternaryChart" class="chart"></div>
      </div>
      <div class="chart-box">
        <div id="ternaryChart2" class="chart"></div>
      </div>
      <div class="chart-box">
        <div id="ternaryChart3" class="chart"></div>
      </div>
      <div class="chart-box">
        <div id="ternaryChart4" class="chart"></div>
      </div>
    </div>
    <script>
      // This app is embedded on /dashboard. Keep the iframe as tall as its
      // charts so the site page owns the only vertical scrollbar.
      (() => {
        const frame = window.frameElement;
        if (!frame) return;

        const fitFrame = () => {
          const contentHeight = Math.ceil(Math.max(
            document.documentElement.scrollHeight,
            document.body.scrollHeight
          ));
          frame.style.height = `${contentHeight}px`;
        };

        const observer = new ResizeObserver(fitFrame);
        observer.observe(document.documentElement);
        observer.observe(document.body);
        window.addEventListener("load", fitFrame);
        window.addEventListener("resize", fitFrame);
        requestAnimationFrame(fitFrame);
      })();
    </script>
  </body>
</html>
