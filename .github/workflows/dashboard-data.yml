name: Dashboard data

# Refreshes the dashboard's captures.csv from the SenseMaker API and publishes it
# to GitHub Pages.
#
# Publishing rather than committing keeps data refreshes off the site's deploy
# path: new captures appear on the dashboard without a commit to main, and so
# without spending a deploybase build. The copy committed at
# public/dashboard-app/captures.csv stays as the fallback the dashboard uses when
# Pages is unreachable.
#
# Migrated from Medibunny/Eurosense, where the same job stopped running in April
# 2025 without anyone noticing: GitHub disables scheduled workflows after 60 days
# without repository activity. A failed run here is visible in the Actions tab.

on:
  schedule:
    # 03:00 UTC: past midnight in every EU timezone, so a day's captures are complete.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch the latest captures
        env:
          SENSEMAKER_PAT_ID: ${{ secrets.SENSEMAKER_PAT_ID }}
          SENSEMAKER_FRAMEWORK: ${{ secrets.SENSEMAKER_FRAMEWORK }}
          DASHBOARD_CSV_OUT: ${{ github.workspace }}/data-site/captures.csv
        run: node scripts/update-dashboard-data.mjs

      # Pages runs Jekyll by default, which would not serve this predictably.
      - name: Disable Jekyll
        run: touch data-site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data-site

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
