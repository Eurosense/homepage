name: Dashboard data

# Refreshes the dashboard's captures.csv from the SenseMaker API and commits it.
#
# Migrated from Medibunny/Eurosense, where the same job silently stopped running
# in April 2025: GitHub disables scheduled workflows after 60 days without
# repository activity, and nothing reported that it had gone quiet. This one
# fails loudly instead — a failed run shows up in the Actions tab and emails the
# repo admins.

on:
  schedule:
    # 03:00 UTC: after midnight in every EU timezone, so a day's captures are complete.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  # Enough to push the refreshed CSV back. The old job used a personal access
  # token for this, which is a broader grant than the work needs.
  contents: write

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch the latest captures
        env:
          SENSEMAKER_PAT_ID: ${{ secrets.SENSEMAKER_PAT_ID }}
          SENSEMAKER_FRAMEWORK: ${{ secrets.SENSEMAKER_FRAMEWORK }}
        run: node scripts/update-dashboard-data.mjs

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- public/dashboard-app/captures.csv; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/dashboard-app/captures.csv
          git commit -m "Refresh dashboard captures data"
          git push
