name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      # Catches the failure mode this site is most exposed to: content that
      # points at an image nobody committed. The build itself stays green for
      # a missing file, but the page ships a broken image.
      - name: Check every media reference resolves
        run: node scripts/check-media.mjs
