name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs before the build because content mistakes are the quiet ones: a
      # misspelled block type, a missing image or a duplicate urlPath all leave
      # `next build` perfectly green while the page ships wrong.
      - name: Validate content
        run: npm run validate

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      # Diffs every built page against its Squarespace snapshot. The build stays
      # green when a block is never extracted, so this is what catches content
      # that silently went missing.
      - name: Compare against the original
        run: node scripts/compare-content.mjs
