name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs before the build because content mistakes are the quiet ones: a
      # misspelled block type, a missing image or a duplicate urlPath all leave
      # `next build` perfectly green while the page ships wrong.
      - name: Validate content
        run: npm run validate

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      # The checks below read `out/`, so they have to follow the build. They are
      # separate steps rather than one `npm run verify` so a red tick says which
      # promise broke without anyone opening the log.

      # The site sets no cookies, which is why it ships no consent banner. One
      # careless <iframe> in a Markdown post makes that false, and it did: five
      # pages were loading Google embeds on view.
      - name: No third-party requests before consent
        run: npm run third-party

      # Next prerenders a link to a page that does not exist, and has no opinion
      # about a page nothing links to. Eleven of the latter had accumulated.
      - name: Internal links and reachability
        run: npm run links

      # axe-core over every built page at 390px and 1280px. The site swaps
      # layouts at 768px and blocks are positioned per breakpoint, so a
      # violation can exist at one width and not the other.
      #
      # This runs on the build rather than on components because the failures it
      # is here to catch are all cascade-level: a heading that inherits a colour
      # from a theme it is not actually sitting on renders perfectly in
      # isolation. Three shipped during the migration.
      - name: Install Chromium for the accessibility check
        run: npx playwright install --with-deps chromium

      - name: Accessibility (WCAG 2.1 AA)
        run: npm run a11y

      # scripts/compare-content.mjs is deliberately NOT run here. It needs the
      # Squarespace snapshots in archive/raw/, which are not committed, and it
      # answers "does this still match the 2026 original?" — a migration
      # question. Once content is edited on purpose, diverging is correct, so
      # gating CI on it would fail for the wrong reason. Run it locally.
